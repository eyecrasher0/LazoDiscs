name: Paper compatibility
on:
  push:
    paths: ['paper/**', 'fabric/26.3/**', 'gradle/**', '.github/workflows/paper.yml']
  pull_request:
    paths: ['paper/**', 'fabric/26.3/**', 'gradle/**', '.github/workflows/paper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        plasmo: [stable, beta]
        target:
          - minecraft: "1.17.1"
            java: "17"
          - minecraft: "1.18.2"
            java: "17"
          - minecraft: "1.19.2"
            java: "17"
          - minecraft: "1.19.4"
            java: "17"
          - minecraft: "1.20.1"
            java: "17"
          - minecraft: "1.20.4"
            java: "17"
          - minecraft: "1.21"
            java: "21"
          - minecraft: "1.21.1"
            java: "21"
          - minecraft: "1.21.3"
            java: "21"
          - minecraft: "1.21.4"
            java: "21"
          - minecraft: "1.21.5"
            java: "21"
          - minecraft: "1.21.6"
            java: "21"
          - minecraft: "1.21.7"
            java: "21"
          - minecraft: "1.21.8"
            java: "21"
          - minecraft: "1.21.9"
            java: "21"
          - minecraft: "1.21.10"
            java: "21"
          - minecraft: "1.21.11"
            java: "21"
          - minecraft: "26.1.1"
            java: "25"
          - minecraft: "26.1.2"
            java: "25"
          - minecraft: "26.2"
            java: "25"
          - minecraft: "26.3"
            java: "25"
        exclude:
          - target: {minecraft: "1.17.1", java: "17"}
            plasmo: beta
          - target: {minecraft: "1.18.2", java: "17"}
            plasmo: beta
          - target: {minecraft: "1.19.2", java: "17"}
            plasmo: beta
          - target: {minecraft: "1.19.4", java: "17"}
            plasmo: beta
          - target: {minecraft: "1.20.1", java: "17"}
            plasmo: beta
          - target: {minecraft: "1.20.4", java: "17"}
            plasmo: beta
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        id: build-java
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '${{ matrix.target.java }}'
      - name: Build and verify release archive
        working-directory: paper/26.3
        env:
          JAVA_HOME: '${{ steps.build-java.outputs.path }}'
        run: ./gradlew --project-cache-dir 'build/${{ matrix.target.minecraft }}/gradle-cache' -PminecraftTarget='${{ matrix.target.minecraft }}' build integrationPlugin --console=plain
      - name: Run disposable Paper integration server
        working-directory: paper/26.3
        run: python3 tools/integration.py --minecraft '${{ matrix.target.minecraft }}' --plasmo '${{ matrix.plasmo }}' --java "$JAVA_HOME/bin/java"
      - name: Upload release JAR
        if: success() && matrix.plasmo == 'stable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lazodiscs-paper-${{ matrix.target.minecraft }}
          path: paper/26.3/build/${{ matrix.target.minecraft }}/libs/lazodiscs-paper-1.0.7+${{ matrix.target.minecraft }}.jar
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-verification-${{ matrix.target.minecraft }}-${{ matrix.plasmo }}
          path: |
            paper/26.3/build/${{ matrix.target.minecraft }}/integration/result-*.json
            paper/26.3/build/${{ matrix.target.minecraft }}/integration/run-*/console.log
