name: Bukkit compatibility
on:
  push:
    paths: ['bukkit/**', 'common/**', 'paper/**', 'fabric/26.3/**', 'gradle/**', 'tools/**', 'compatibility.json', 'server-builds.json', '.github/workflows/bukkit.yml']
  pull_request:
    paths: ['bukkit/**', 'common/**', 'paper/**', 'fabric/26.3/**', 'gradle/**', 'tools/**', 'compatibility.json', 'server-builds.json', '.github/workflows/bukkit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: targets
        run: echo "matrix=$(python3 tools/server-test-matrix.py)" >> "$GITHUB_OUTPUT"
  servers:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        id: build-java
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '${{ matrix.runtime }}'
      - name: Build universal Bukkit release
        env:
          JAVA_HOME: ${{ steps.build-java.outputs.path }}
        run: python3 tools/build-matrix.py --platform bukkit --jobs 1
      - name: Run disposable upstream server
        run: python3 tools/server-integration.py --platform '${{ matrix.platform }}' --minecraft '${{ matrix.minecraft }}' --java "$JAVA_HOME/bin/java" --work-root build-matrix/servers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bukkit-verification-${{ matrix.platform }}-${{ matrix.minecraft }}
          path: |
            build-matrix/results/**
            build-matrix/logs/**
            build-matrix/servers/**/result.json
            build-matrix/servers/**/console.log
