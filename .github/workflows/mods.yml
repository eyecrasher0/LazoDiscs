name: Mod compatibility
on:
  push:
    paths: ['fabric/**', 'forge/**', 'neoforge/**', 'common/**', 'legacy-client/**', 'gradle/**', 'tools/**', 'compatibility.json', 'compatibility-policy.json', 'fabric-api-lock.json', '.github/workflows/mods.yml']
  pull_request:
    paths: ['fabric/**', 'forge/**', 'neoforge/**', 'common/**', 'legacy-client/**', 'gradle/**', 'tools/**', 'compatibility.json', 'compatibility-policy.json', 'fabric-api-lock.json', '.github/workflows/mods.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: targets
        run: echo "matrix=$(python3 tools/ci-matrix.py)" >> "$GITHUB_OUTPUT"
  mods:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and verify final release archive
        run: python3 tools/build-matrix.py --platform '${{ matrix.platform }}' --versions '${{ matrix.minecraft }}' --jobs 1
      - name: Verify published Voice binary linkage
        if: matrix.platform != 'legacy-client'
        run: node tools/verify-plasmo-linkage.mjs --loader='${{ matrix.platform }}' --minecraft='${{ matrix.minecraft }}'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: matrix.minecraft == '1.16.5' || matrix.minecraft == '1.17' || matrix.minecraft == '1.17.1'
        with:
          distribution: temurin
          java-version: '${{ matrix.runtime }}'
      - name: Execute native audio on the game's JVM
        if: matrix.minecraft == '1.16.5' || matrix.minecraft == '1.17' || matrix.minecraft == '1.17.1'
        shell: bash
        run: |
          runtime='${{ matrix.runtime }}'
          if [ "$runtime" = 8 ]; then runtime=1.8; fi
          python3 tools/verify-packaged-audio.py --jar 'build-matrix/${{ matrix.platform }}/${{ matrix.minecraft }}/libs/lazodiscs-${{ matrix.platform }}-1.0.8+${{ matrix.minecraft }}.jar' --java "$JAVA_HOME/bin/java" --javac "$JAVA_HOME_25_X64/bin/javac" --version "$runtime" --report 'build-matrix/verification/native-audio.json'
