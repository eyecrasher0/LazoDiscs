plugins { id 'xyz.wagyourtail.jvmdowngrader' version '2.0.1'; id 'com.gradleup.shadow' version '8.3.11'; id 'java-library'; id 'net.minecraftforge.gradle' version '6.0.54' }
minecraft { mappings channel: 'official', version: '1.16.5' }
dependencies { minecraft 'net.minecraftforge:forge:1.16.5-36.2.42' }
