plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.2.2'
}

def minecraftTarget = providers.gradleProperty('minecraftTarget').getOrElse('26.3')
def targets = new groovy.json.JsonSlurper().parse(file('../targets.json'))
if (!targets.containsKey(minecraftTarget)) throw new GradleException("Unsupported Paper target: ${minecraftTarget}")
def javaTarget = targets[minecraftTarget].java as int
def legacyTarget = !minecraftTarget.startsWith('26.') && (
    !minecraftTarget.startsWith('1.21') || minecraftTarget in ['1.21', '1.21.1', '1.21.3'])
def useSongDatapack = !legacyTarget && minecraftTarget != '26.3'
def descriptorApi = javaTarget < 21 ? minecraftTarget.tokenize('.').take(2).join('.') : minecraftTarget
def paperApi = targets[minecraftTarget].api
version = "1.0.7+${minecraftTarget}"
layout.buildDirectory = layout.projectDirectory.dir("build/${minecraftTarget}")
group = 'com.eyecrasher'

base {
    archivesName = 'lazodiscs-paper'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
    maven {
        url = 'https://repo.plasmoverse.com/releases'
    }
    maven {
        url = 'https://repo.plo.su/'
    }
    maven {
        url = 'https://maven.lavalink.dev/releases'
    }
    maven {
        url = 'https://maven.lavalink.dev/snapshots'
    }
    maven {
        url = 'https://jitpack.io'
    }
}

configurations {
    shade
    shadeRuntime
    implementation.extendsFrom(shade)
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperApi}"
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.2.21'

    compileOnly('su.plo.voice.api:server:2.1.10') {
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'com.google.guava', module: 'failureaccess'
        exclude group: 'com.google.guava', module: 'listenablefuture'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'org.checkerframework', module: 'checker-qual'
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'com.google.code.gson', module: 'gson'
    }

    // Private libraries are relocated and kept off Minecraft's compile classpath.
    // The BOM aligns core/databind 2.21.7 with annotations 2.21.
    shadeRuntime platform('com.fasterxml.jackson:jackson-bom:2.21.7')
    shadeRuntime 'com.fasterxml.jackson.core:jackson-core'
    shadeRuntime 'com.fasterxml.jackson.core:jackson-databind'
    shadeRuntime 'com.fasterxml.jackson.core:jackson-annotations'
    shadeRuntime('org.apache.httpcomponents:httpclient:4.5.14') {
        exclude group: 'commons-codec', module: 'commons-codec'
    }

    // Security-patched audio transitives stay off Minecraft's compile graph.
    shadeRuntime 'org.mozilla:rhino:1.7.15.1'
    shadeRuntime 'org.mozilla:rhino-engine:1.7.15.1'
    shadeRuntime 'org.json:json:20260719'
    shadeRuntime 'commons-io:commons-io:2.22.0'
    shadeRuntime 'commons-codec:commons-codec:1.23.0'
    shadeRuntime 'com.google.code.gson:gson:2.15.0'

    shade('dev.arbjerg:lavaplayer:2.2.7') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
        exclude group: 'commons-io', module: 'commons-io'
        exclude group: 'commons-codec', module: 'commons-codec'
        exclude group: 'net.java.dev.jna', module: 'jna'
        exclude group: 'org.jetbrains', module: 'annotations'
        exclude group: 'org.jetbrains.kotlin'
        exclude group: 'org.jetbrains.kotlinx'
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson'
        exclude group: 'org.apache.httpcomponents'
        exclude group: 'org.mozilla'
        exclude group: 'org.json'
    }
    shade('dev.lavalink.youtube:v2:2be8e542d3f6f178e048dca565892684c2e40177-SNAPSHOT') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
        exclude group: 'commons-io', module: 'commons-io'
        exclude group: 'commons-codec', module: 'commons-codec'
        exclude group: 'net.java.dev.jna', module: 'jna'
        exclude group: 'org.jetbrains', module: 'annotations'
        exclude group: 'org.jetbrains.kotlin'
        exclude group: 'org.jetbrains.kotlinx'
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson'
        exclude group: 'org.apache.httpcomponents'
        exclude group: 'org.mozilla'
        exclude group: 'org.json'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaTarget
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'apiVersion', descriptorApi
    filesMatching('paper-plugin.yml') {
        expand version: project.version, apiVersion: descriptorApi
    }
    if (legacyTarget) {
        exclude 'paper-plugin.yml'
        from('src/legacy/resources') {
            include 'plugin.yml'
            expand version: project.version, apiVersion: descriptorApi
        }
    }
}

jar {
    archiveClassifier.set('thin')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.shade, project.configurations.shadeRuntime]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()

    relocate 'org.apache.http', 'com.eyecrasher.lazodiscs.shadow.org.apache.http'
    relocate 'org.apache.commons.logging', 'com.eyecrasher.lazodiscs.shadow.org.apache.commons.logging'
    relocate 'com.fasterxml.jackson', 'com.eyecrasher.lazodiscs.shadow.com.fasterxml.jackson'
    relocate 'org.apache.commons.io', 'com.eyecrasher.lazodiscs.shadow.org.apache.commons.io'
    relocate 'org.apache.commons.codec', 'com.eyecrasher.lazodiscs.shadow.org.apache.commons.codec'
    relocate 'com.google.gson', 'com.eyecrasher.lazodiscs.shadow.com.google.gson'

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/MANIFEST.MF'
    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'

    exclude 'org/slf4j/**'
    exclude 'com/google/common/**'
    exclude 'it/unimi/dsi/fastutil/**'
    exclude 'com/sun/jna/**'
    exclude 'javax/annotation/**'
    exclude 'org/jetbrains/annotations/**'
    exclude 'org/checkerframework/**'
    exclude 'kotlin/**'
    exclude 'kotlinx/**'
}

assemble.dependsOn shadowJar
build.dependsOn shadowJar

// Include the project's license in release, development and source archives.
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(file('../../LICENSE'))
}

// Preserve third-party licenses/notices and verify the final release archive.
apply from: '../../gradle/third-party-notices.gradle'

// Exclude deprecated YouTube authentication and check the final archive.
apply from: '../../gradle/audio-sources.gradle'

// Share the tested resolver, Spotify matching and SoundCloud AAC implementation with the mod.
def sharedAudio = tasks.register('sharedAudio', Sync) {
    from('../../fabric/26.3/src/main/java') {
        include 'com/eyecrasher/lazodiscs/voice/AudioLoadExecutor.java'
        include 'com/eyecrasher/lazodiscs/voice/AudioResolver.java'
        include 'com/eyecrasher/lazodiscs/voice/LavaPcmFeeder.java'
        include 'com/eyecrasher/lazodiscs/voice/SoundCloudAacSourceManager.java'
        include 'com/eyecrasher/lazodiscs/voice/SpotifyTitleResolver.java'
        include 'com/eyecrasher/lazodiscs/service/**'
        include 'com/eyecrasher/lazodiscs/data/CustomDiscData.java'
    }
    into layout.buildDirectory.dir('generated/sources/sharedAudio')
}
sourceSets.main.java.setSrcDirs([sharedAudio, 'src/main/java', legacyTarget ? 'src/legacy/java' : 'src/modern/java'])
if (!legacyTarget) sourceSets.main.java.srcDir(useSongDatapack ? 'src/compat/java' : 'src/registry/java')
if (useSongDatapack) {
    def songsDir = layout.buildDirectory.dir('generated/songs')
    def generateSongs = tasks.register('generateSongs') {
        outputs.dir(songsDir)
        doLast {
            def root = songsDir.get().asFile
            root.mkdirs()
            new File(root, 'pack.mcmeta').text = groovy.json.JsonOutput.toJson([pack: [pack_format: 61, supported_formats: [57, 999], min_format: 57, max_format: 999, description: 'LazoDiscs silent jukebox songs']])
            def songs = new File(root, 'data/lazodiscs/jukebox_song')
            songs.mkdirs()
            (0..15).each { strength ->
                new File(songs, "recording_${strength}.json").text = groovy.json.JsonOutput.toJson([sound_event: 'minecraft:intentionally_empty', description: '', length_in_seconds: 604800, comparator_output: strength])
            }
        }
    }
    def songsZip = tasks.register('songsZip', Zip) {
        dependsOn generateSongs
        from songsDir
        archiveFileName = 'lazodiscs-songs.zip'
        destinationDirectory = layout.buildDirectory.dir('generated/resources')
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    processResources { from(songsZip) }
}
processResources {
    from('../../fabric/26.3/src/main/resources') {
        include 'lazodiscs_languages/**'
        include 'assets/lazodiscs/textures/icons/discs.png'
    }
}
// This fixture is a separate plugin and is never included in the release archive.
sourceSets {
    integrationTest {
        if (legacyTarget) {
            java.setSrcDirs(['src/legacyTest/java'])
            resources.setSrcDirs(['src/legacyTest/resources'])
        }
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}
tasks.named('processIntegrationTestResources') {
    inputs.property 'apiVersion', descriptorApi
    filesMatching('paper-plugin.yml') {
        expand apiVersion: descriptorApi
    }
    filesMatching('plugin.yml') { expand apiVersion: descriptorApi }
}
tasks.register('integrationPlugin', Jar) {
    dependsOn integrationTestClasses
    archiveFileName = 'lazodiscs-paper-integration.jar'
    from sourceSets.integrationTest.output
}
