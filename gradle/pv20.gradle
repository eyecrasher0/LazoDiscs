// Select only on Minecraft targets whose newest official Voice uses the old 2.0 API.
def pv20Sources = tasks.register('pv20Sources', Sync) {
    from('src/main/java')
    from('../../common/variants/pv20/java')
    into layout.buildDirectory.dir('generated/sources/pv20')
}
lazoCommonAudio.setExcludes(lazoVoice1Sources)
sourceSets.main.java.setSrcDirs([pv20Sources])
sourceSets.main.java.source(lazoCommonAudio)
dependencies { compileOnly 'javax.inject:javax.inject:1' }
